name: CI/CD Pipeline to Kamatera VPS

on:
  push:
    branches:
      - smile-dev

jobs:
  deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Backend with Maven
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Copy Backend files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "backend/target/ecommerce.jar,backend/Dockerfile"
          target: "/opt/sba301/backend-tmp"
          strip_components: 1

      - name: Deploy and Restart Backend on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /opt/sba301/backend/target
            mv /opt/sba301/backend-tmp/Dockerfile /opt/sba301/backend/Dockerfile
            mv /opt/sba301/backend-tmp/target/ecommerce.jar /opt/sba301/backend/target/ecommerce.jar
            rm -rf /opt/sba301/backend-tmp
            
            # Restart container Backend trong docker-compose
            cd /opt/sba301/backend
            docker compose up -d --build app

  deploy-frontend:
    name: Build & Deploy Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and Build Frontend
        run: |
          cd frontend
          echo "VITE_API_BASE_URL=https://api.smiledev.id.vn/api/v1" > .env
          npm ci
          npm run build

      - name: Deploy Frontend files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend/dist/**"
          target: "/var/www/sba301/frontend-tmp"
          strip_components: 2

      - name: Move Frontend files to Nginx web root
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /var/www/sba301/frontend
            rm -rf /var/www/sba301/frontend/*
            mv /var/www/sba301/frontend-tmp/* /var/www/sba301/frontend/
            rm -rf /var/www/sba301/frontend-tmp
            chown -R www-data:www-data /var/www/sba301/frontend
