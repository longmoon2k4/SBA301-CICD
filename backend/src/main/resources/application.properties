spring.application.name=sba301-ecommerce

# ===== DataSource (MariaDB) =====
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smiledev_data}
spring.datasource.username=${DB_USERNAME:smiledev_data}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===== Server =====
server.port=8080
server.servlet.context-path=/api/v1

# ===== Springdoc / Swagger UI =====
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===== Actuator (dev) =====
management.endpoints.web.exposure.include=health,info

# ===== Custom email config =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:group1projecthms@gmail.com}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== JWT =====
# Thay bằng secret thật >= 32 bytes base64, ví dụ: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET:dGhpc2lzYXZlcnlsb25nc2VjcmV0a2V5dGhhdGlzbW9yZXRoYW4zMmJ5dGVzbG9uZw==}
app.jwt.expiration-ms=86400000

# ===== CORS — Cho phép FE Vite dev server =====
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://shop.smiledev.id.vn,http://shop.smiledev.id.vn

# ===== VNPAY Sandbox =====
